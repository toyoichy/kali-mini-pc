code: "kali"
name: "Kali Linux ARM64 XFCE"
description: |
  Kali Linux ARM64 with XFCE desktop, integrated terminal, and rootless PRoot runtime.
preview: "https://www.kali.org/images/kali-logo.svg"
webpage: "https://www.kali.org/docs/nethunter/nethunter-rootless/"
feature:
  - type: "audio"
    name: "Audio Playback"
    description: "Forward Linux desktop audio to Android."
    enabled: false
  - type: "microphone"
    name: "Microphone Forwarding"
    description: "Forward Android microphone audio into Kali."
  - type: "avnc"
    name: "Kali XFCE Desktop"
    description: "Open the XFCE desktop in the integrated AVNC frontend."
    command: |
      mkdir -p "$HOME/.vnc"
      Xtigervnc -geometry 1280x720 -ZlibLevel=0 -pn -rfbport -1
      -SendPrimary=off -SetPrimary=off -FrameRate=60
      -rfbunixpath /tmp/.tiny.vnc -alwaysshared -SecurityTypes=None
      -desktop "Kali-Mini-PC" :6 +extension MIT-SHM > /dev/null 2>&1 &
      while [ ! -S /tmp/.tiny.vnc ]; do sleep 0.1; done
      startxfce4 > /dev/null 2>&1 &
    link: "vnc://127.0.0.1:5906"
    use_unix_socket: true
    enabled: true
    adapt_to_screen_size: true
    scale_ratio: 0
  - type: "storage"
    name: "External Storage"
    description: "Mount Android shared storage when the user enables storage access."
    enabled: false
boot_command: >
  $BIN_DIR/proot $EXTRA_ARGS -H --kill-on-exit --link2symlink --sysvipc
  -L --change-id=1000:1000 --rootfs=$CONTAINER_DIR --cwd=/home/kali
  --bind=/data --bind=/dev --bind=/proc --bind=/sys
  --bind=/dev/urandom:/dev/random
  --bind=/proc/self/fd:/dev/fd
  --bind=/proc/self/fd/0:/dev/stdin
  --bind=/proc/self/fd/1:/dev/stdout
  --bind=/proc/self/fd/2:/dev/stderr
  --bind=$CACHE_DIR/tmp:/dev/shm
  --bind=$CACHE_DIR/tmp:/tmp
  --bind=$CACHE_DIR/run:/run
  /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$EXTRA_PATH
  LD_LIBRARY_PATH=$EXTRA_LD_LIBRARY_PATH LD_PRELOAD=$EXTRA_LD_PRELOAD
  DISPLAY=:6 LANG=en_US.UTF-8
  HOME=/home/kali USER=kali TERM=xterm-256color COLORTERM=truecolor
  $EXTRA_ENV /bin/bash -l
